<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 
      ============================================
      APP TITLE AND SEO META TAGS
      ============================================
      To change the app name:
      1. Update the <title> tag below
      2. Update og:title meta tag
      3. Also update APP_NAME in src/config/appConfig.ts
    -->
    <title>roomee - Student Accommodation</title>
    <meta
      name="description"
      content="Find verified student accommodation and roommates in South Africa. Connect with landlords near your university."
    />
    <meta name="author" content="roomee" />
    <meta
      name="keywords"
      content="student accommodation, student housing, roommates, South Africa, university accommodation, TVET college housing"
    />

    <!-- Open Graph tags for social sharing -->
    <meta property="og:title" content="roomee - Student Accommodation" />
    <meta
      property="og:description"
      content="Find verified student accommodation and roommates in South Africa."
    />
    <meta property="og:type" content="website" />

    <!-- Twitter/X card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@roomee" />

    <link rel="icon" href="/favicon.png" type="image/png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
